services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seatlock
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock
    ports:
      - "5432:5432"
    volumes:
      - seatlock_pg:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://seatlock:seatlock@db:5432/seatlock
      FRONTEND_ORIGINS: http://localhost:5173
      HOLD_DURATION_SECONDS: 300
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  seatlock_pg:
