services:
  - type: web
    name: seatlock-api
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: HOLD_DURATION_SECONDS
        value: "300"
      - key: SESSION_DAYS
        value: "7"
